services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tasktrack
      POSTGRES_USER: tasktrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tasktrack]
      interval: 5s
      retries: 10
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ['127.0.0.1:8025:8025']
  migrate:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      TASKTRACK_DATABASE_URL: postgresql+psycopg://tasktrack:${POSTGRES_PASSWORD}@postgres:5432/tasktrack
    command: [alembic, upgrade, head]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      TASKTRACK_DATABASE_URL: postgresql+psycopg://tasktrack:${POSTGRES_PASSWORD}@postgres:5432/tasktrack
      TASKTRACK_REDIS_URL: redis://redis:6379/0
      TASKTRACK_SMTP_HOST: mailpit
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')",
        ]
      interval: 10s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      TASKTRACK_DATABASE_URL: postgresql+psycopg://tasktrack:${POSTGRES_PASSWORD}@postgres:5432/tasktrack
      TASKTRACK_REDIS_URL: redis://redis:6379/0
      TASKTRACK_SMTP_HOST: mailpit
    command: [celery, -A, tasktrack.jobs:celery, worker, --loglevel=INFO]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  beat:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      TASKTRACK_DATABASE_URL: postgresql+psycopg://tasktrack:${POSTGRES_PASSWORD}@postgres:5432/tasktrack
      TASKTRACK_REDIS_URL: redis://redis:6379/0
    command:
      [
        celery,
        -A,
        tasktrack.jobs:celery,
        beat,
        --loglevel=INFO,
        --schedule=/tmp/celerybeat-schedule,
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
